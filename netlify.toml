[build]
  # Use custom install command to skip postinstall scripts (React Native deps require native tools)
  command = "pnpm install --ignore-scripts && pnpm build:web"
  publish = "apps/web/.next"

[context.production]
  command = "pnpm install --ignore-scripts && pnpm build:web"

[context.deploy-preview]
  command = "pnpm install --ignore-scripts && pnpm build:web"
