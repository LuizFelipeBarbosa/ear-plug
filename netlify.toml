[build]
  # We run pnpm install ourselves with --ignore-scripts in the build command
  # This is needed because React Native deps have postinstall scripts requiring native tools
  command = "pnpm install --ignore-scripts && pnpm build:web"
  publish = "apps/web/.next"

# Environment variables to skip postinstall scripts
[build.environment]
  # For npm (fallback)
  NPM_FLAGS = "--ignore-scripts"
  # Forces pnpm to skip lifecycle scripts during install
  npm_config_ignore_scripts = "true"
  # Disable Netlify's secrets detection for NEXT_PUBLIC_* vars that are intentionally in build output
  # These are public keys meant to be exposed to the client
  SECRETS_SCAN_ENABLED = "false"

[context.production]
  command = "pnpm install --ignore-scripts && pnpm build:web"

[context.deploy-preview]
  command = "pnpm install --ignore-scripts && pnpm build:web"
