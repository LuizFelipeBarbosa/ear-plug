[build]
  # We run pnpm install ourselves with --ignore-scripts in the build command
  # This is needed because React Native deps have postinstall scripts requiring native tools
  command = "pnpm install --ignore-scripts --filter @ear-plug/web... && (find apps/web/.next -mindepth 1 -delete 2>/dev/null || true) && (find apps/web/.netlify/.next -mindepth 1 -delete 2>/dev/null || true) && pnpm --dir apps/web build"
  publish = "apps/web/.next"

# Environment variables to skip postinstall scripts
[build.environment]
  # For npm (fallback)
  NPM_FLAGS = "--ignore-scripts"
  # Forces pnpm to skip lifecycle scripts during install
  npm_config_ignore_scripts = "true"

[context.production]
  command = "pnpm install --ignore-scripts --filter @ear-plug/web... && (find apps/web/.next -mindepth 1 -delete 2>/dev/null || true) && (find apps/web/.netlify/.next -mindepth 1 -delete 2>/dev/null || true) && pnpm --dir apps/web build"

[context.deploy-preview]
  command = "pnpm install --ignore-scripts --filter @ear-plug/web... && (find apps/web/.next -mindepth 1 -delete 2>/dev/null || true) && (find apps/web/.netlify/.next -mindepth 1 -delete 2>/dev/null || true) && pnpm --dir apps/web build"

# Security response headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.com https://*.clerk.accounts.dev https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://images.clerk.dev https://img.clerk.com https://lh3.googleusercontent.com https://images.unsplash.com https://*.googleapis.com https://*.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.convex.cloud https://*.convex.site wss://*.convex.cloud https://api.clerk.com https://*.clerk.com https://maps.googleapis.com https://maps.gstatic.com; frame-src 'self' https://*.clerk.com https://*.google.com; media-src 'self' blob: https://assets.mixkit.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
